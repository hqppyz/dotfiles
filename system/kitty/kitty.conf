term xterm-256color

font_size          14.0
background_opacity 0.65
enable_audio_bell  no
resize_in_steps    yes
scrollback_lines   5000

map ctrl+left        send_text all \x1b\x62
map ctrl+right       send_text all \x1b\x66
map ctrl+backspace   send_text all \x17
map ctrl+shift+left  no_op
map ctrl+shift+right no_op
#map ctrl+shift+home no_op
#map ctrl+shift+end  no_op
map ctrl+page_up     previous_tab
map ctrl+page_down   next_tab
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward

active_tab_background  #fdaefd
#active_tab_foreground #5fffff

tab_bar_min_tabs            2
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

#include latte.conf
include colors.conf

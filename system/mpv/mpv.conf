# Classic film subtitles: yellow text, black outline, soft shadow.
# Forced over embedded ASS/SSA styles too.
# Apply with --profile=forced-yellow or the apply-profile command.
[forced-yellow]
profile-desc=Forced yellow classic film subtitles
sub-ass-override=force
sub-font=sans-serif
sub-bold=yes
sub-font-size=46
sub-color=1.0/1.0/0.0/1.0
sub-border-style=outline-and-shadow
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3
sub-shadow-color=0.0/0.0/0.0/0.5
sub-shadow-offset=1.5
sub-margin-y=36
sub-align-y=bottom
sub-justify=center
